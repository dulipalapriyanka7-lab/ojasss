# Supabase project configuration for OJASSS (used by `supabase link` / `supabase db push` / `supabase functions deploy`).
project_id = "ojasss"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "https://ojasss.com"
additional_redirect_urls = [
  "https://ojasss.com/auth/callback",
  "https://www.ojasss.com/auth/callback",
  "http://localhost:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_length = 6
otp_expiry = 900
max_frequency = "60s"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false

[functions.create-post]
verify_jwt = true

[functions.send-complaint-email]
verify_jwt = true

# Public by design (deletion must work without signing in); protected by HMAC OTP + rate limits.
[functions.create-account-deletion-request]
verify_jwt = false

[functions.verify-account-deletion-otp]
verify_jwt = false

# Public crawler endpoint (read-only, anonymous data only).
[functions.post-og]
verify_jwt = false

# Called by a Database Webhook; authenticated with the x-webhook-secret header.
[functions.push-dispatch]
verify_jwt = false
