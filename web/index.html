<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a10" />
    <meta name="color-scheme" content="light dark" />
    <title>OJASSS — Short videos & posters</title>
    <meta name="description" content="OJASSS — watch, create and earn with short videos and posters. Made in India for creators, businesses and citizens." />
    <link rel="canonical" href="https://ojasss.com/" />
    <meta property="og:site_name" content="OJASSS" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OJASSS — Short videos & posters" />
    <meta property="og:description" content="Watch, create and earn with short videos and posters." />
    <meta property="og:url" content="https://ojasss.com/" />
    <meta property="og:image" content="https://ojasss.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/brand/mark.png" type="image/png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/ojasss-splash.css" />
    <link rel="preload" href="/brand/logo.png" as="image" />
    <script src="/theme-init.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <noscript><style>#ojasss-static-splash{display:none}</style>OJASSS needs JavaScript to run. Please enable it in your browser.</noscript>
    <div id="root"></div>
    <section id="ojasss-static-splash" class="oj-splash oj-splash-static" aria-label="OJASSS startup">
      <span class="oj-splash-wave" aria-hidden="true"></span>
      <div class="oj-splash-content">
        <div class="oj-splash-orbit" aria-hidden="true">
          <span class="oj-splash-ring"></span>
          <span class="oj-splash-rotor"><span class="oj-splash-star-glow"><i class="oj-splash-star"></i></span></span>
          <img class="oj-splash-logo" src="/brand/logo.png" alt="" width="160" height="160"/>
        </div>
        <strong class="oj-splash-brand">OJASSS</strong>
        <span class="oj-splash-tagline">THE INDIAN MASS POWER APP</span>
        <p class="oj-splash-state" role="status">Starting OJASSS…</p>
        <div class="oj-splash-progress" data-pending="true" role="progressbar" aria-label="Startup progress">
          <span class="oj-splash-segment"><span class="oj-splash-star-glow"><i class="oj-splash-star"></i></span></span>
        </div>
        <button type="button" class="oj-splash-retry" hidden>Try again</button>
      </div>
    </section>
    <script src="/ojasss-splash.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
